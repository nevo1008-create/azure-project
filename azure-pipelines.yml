trigger:
- main
- develop

pool:
  vmImage: ubuntu-latest

variables:
  packageVersion: '1.0.$(Build.BuildId)'
  packageName: '$(Build.SourceBranchName)_$(packageVersion)'

steps:

# SonarQube - main only
- task: SonarCloudPrepare@4.4.0
  condition: eq(variables['Build.SourceBranchName'], 'main')
  inputs:
    SonarCloud: 'nevo-token-sonar'
    organization: 'nevo1008-create'
    scannerMode: 'dotnet'
    projectKey: 'nevo1008-create_azure-project'

# Restore - both branches
- script: dotnet restore HelloWorld/HelloWorld.csproj
  displayName: Restore

# Build - both branches
- script: dotnet build HelloWorld/HelloWorld.csproj --configuration Release
  displayName: Build

# SonarQube - main only
- task: SonarCloudAnalyze@4.4.0
  condition: eq(variables['Build.SourceBranchName'], 'main')
  displayName: SonarQube Analysis

- task: SonarCloudPublish@4.4.0
  condition: eq(variables['Build.SourceBranchName'], 'main')
  displayName: Quality Gate
  inputs:
    pollingTimeoutSec: '300'

# Print version and package name
- script: |
    echo "Version: $(packageVersion)"
    echo "Package name: $(packageName)"
  displayName: Print version

# NuGet - main only
- script: |
    dotnet pack HelloWorld/HelloWorld.csproj \
      --configuration Release \
      --no-build \
      -p:PackageId=$(packageName) \
      -p:PackageVersion=$(packageVersion) \
      --output $(Build.ArtifactStagingDirectory)/nuget
  condition: eq(variables['Build.SourceBranchName'], 'main')
  displayName: Create NuGet

- task: DotNetCoreCLI@2
  condition: eq(variables['Build.SourceBranchName'], 'main')
  displayName: Upload NuGet
  inputs:
    command: push
    packagesToPush: '$(Build.ArtifactStagingDirectory)/nuget/*.nupkg'
    nuGetFeedType: internal
    publishVstsFeed: 'nevo/hello-world-feed'

# Universal Package - develop only
- script: dotnet publish HelloWorld/HelloWorld.csproj --configuration Release --output $(Build.ArtifactStagingDirectory)/publish
  condition: eq(variables['Build.SourceBranchName'], 'develop')
  displayName: Publish

- task: UniversalPackages@0
  condition: eq(variables['Build.SourceBranchName'], 'develop')
  displayName: Upload Universal Package
  inputs:
    command: publish
    publishDirectory: '$(Build.ArtifactStagingDirectory)/publish'
    feedsToUsePublish: internal
    vstsFeedPublish: 'nevo/hello-world-feed'
    vstsFeedPackagePublish: '$(packageName)'
    versionOption: custom
    versionPublish: '$(packageVersion)'
trigger:
- main
- develop

pool:
  vmImage: ubuntu-latest

variables:
  packageVersion: '1.0.$(Build.BuildId)'

steps:

# SonarQube - develop only
- task: SonarCloudPrepare@4
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
  inputs:
    SonarCloud: 'nevo-token-sonar'
    organization: 'nevo1008-create'
    scannerMode: 'dotnet'
    projectKey: 'nevo1008-create_azure-project'

# Restore
- script: dotnet restore HelloWorld/HelloWorld.csproj
  displayName: Restore dependencies

# Build
- script: dotnet build HelloWorld/HelloWorld.csproj --configuration Release
  displayName: Build application

# SonarQube - develop only
- task: SonarCloudAnalyze@4
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
  displayName: Run SonarQube analysis

# SonarQube Quality Gate - develop only
- task: SonarCloudPublish@4
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/develop')
  displayName: Publish Quality Gate
  inputs:
    pollingTimeoutSec: '300'

# Create deployment files - main only
- script: dotnet publish HelloWorld/HelloWorld.csproj --configuration Release --output $(Build.ArtifactStagingDirectory)/publish
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
  displayName: Publish application

# Upload package - main only
- task: UniversalPackages@0
  condition: eq(variables['Build.SourceBranch'], 'refs/heads/main')
  displayName: Upload to Azure Artifacts
  inputs:
    command: publish
    publishDirectory: '$(Build.ArtifactStagingDirectory)/publish'
    feedsToUsePublish: internal
    vstsFeedPublish: 'nevo/hello-world-feed'
    vstsFeedPackagePublish: 'hello-world'
    versionOption: custom
    versionPublish: '$(packageVersion)'